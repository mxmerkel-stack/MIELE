name: Miele Login

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code aus der Redirect-URL (Wert hinter code=)"
        required: true

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code gegen Token tauschen und als Secret speichern
        env:
          MIELE_CLIENT_ID: ${{ secrets.MIELE_CLIENT_ID }}
          MIELE_CLIENT_SECRET: ${{ secrets.MIELE_CLIENT_SECRET }}
          MIELE_CODE: ${{ inputs.code }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/login.py
